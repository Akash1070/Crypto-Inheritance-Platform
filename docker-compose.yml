services:
  # ============================================================================
  # 1. PostgreSQL Database with Blind HMAC Indexing
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cip_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong unique value}
      POSTGRES_DB: cip_vaults
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cip-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cip_admin -d cip_vaults"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Vault Coordination API (Zero Raw Secret Invariant)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: cip-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://cip_admin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/cip_vaults
      CIP_WEB_ORIGIN: http://localhost:8080
      CIP_EXPECTED_ORIGIN: http://localhost:8080
      CIP_COOKIE_SECRET: ${CIP_COOKIE_SECRET:?set CIP_COOKIE_SECRET to a strong unique value}
      CIP_SERVER_SIGNING_KEY_HEX: ${CIP_SERVER_SIGNING_KEY_HEX:?set CIP_SERVER_SIGNING_KEY_HEX to a unique 32-byte hex secret}
      CIP_ENCLAVE_URL: http://release-signer:3001
      CIP_TRUSTED_PROXY: "true"
    networks:
      - cip-internal
      - cip-public
      - cip-enclave-net
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # 3. Background Scheduler & Liveness Escalation Worker
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: cip-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cip_admin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/cip_vaults
      CIP_SERVER_SIGNING_KEY_HEX: ${CIP_SERVER_SIGNING_KEY_HEX:?set CIP_SERVER_SIGNING_KEY_HEX}
      CIP_WORKER_INTERVAL_MS: 30000
    networks:
      - cip-internal
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # 4. Isolated Release-Signer Enclave (mTLS, Multi-Clock Verified Escrow Release)
  # Zero outbound access: internal network only
  # ============================================================================
  release-signer:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.release-signer
    container_name: cip-release-signer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      CIP_ENCLAVE_PRIVATE_KEY_HEX: ${CIP_ENCLAVE_PRIVATE_KEY_HEX:?set CIP_ENCLAVE_PRIVATE_KEY_HEX to a unique 32-byte hex secret}
      CIP_RELEASE_SIGNING_KEY_HEX: ${CIP_RELEASE_SIGNING_KEY_HEX:?set CIP_RELEASE_SIGNING_KEY_HEX to a unique 32-byte hex secret}
      CIP_SERVER_SIGNING_PUBLIC_KEY_HEX: ${CIP_SERVER_SIGNING_PUBLIC_KEY_HEX:?set CIP_SERVER_SIGNING_PUBLIC_KEY_HEX}
      CIP_RELEASE_SHARED_SECRET: ${CIP_RELEASE_SHARED_SECRET:?set CIP_RELEASE_SHARED_SECRET to a strong unique value}
      CIP_TLS_CERT_FILE: /certs/enclave.crt
      CIP_TLS_KEY_FILE: /certs/enclave.key
      CIP_TLS_CA_FILE: /certs/api-ca.crt
    volumes:
      - ${CIP_TLS_CERT_DIR:-./certs}:/certs:ro
    networks:
      - cip-enclave-net
    security_opt:
      - no-new-privileges:true

  # ============================================================================
  # 5. Hardened Web Dashboard (Unprivileged Nginx, Strict CSP)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: cip-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:8080"
    networks:
      - cip-public
    security_opt:
      - no-new-privileges:true

networks:
  cip-public:
    driver: bridge
  cip-internal:
    driver: bridge
  cip-enclave-net:
    driver: bridge
    internal: true # Enforces air-gap: no egress to external internet

volumes:
  postgres_data:
