name: Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 12.16.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832e0b1 # v4.0.3
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@f6277e923aa4d39f60e909568972b2512a8dbbe3 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run Tests & Measure Coverage
        run: pnpm test

      - name: Dependency Vulnerability Audit
        run: pnpm audit --audit-level=high

